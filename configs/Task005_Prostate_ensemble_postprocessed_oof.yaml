dataset:
  id: Task005_Prostate
  display_name: MSD Prostate (official nnU-Net v1, 2D + 3D ensemble OOF + official postprocessing)
  labels:
    0: background
    1: peripheral zone
    2: transition zone
  channel_labels: [0, 1, 2]
  ignore_label: null

inputs:
  probabilities_dir: ../work/v1/oof/Task005_Prostate_ensemble/fold_predictions
  labels_dir: ../work/v1/release_labels/Task005_Prostate
  probability_glob: "fold_*/*.npz"
  probability_key: softmax
  label_extension: .nii.gz
  native_predictions_dir: ../work/v1/RESULTS_FOLDER/nnUNet/ensembles/Task005_Prostate/ensemble_2d__nnUNetTrainerV2__nnUNetPlansv2.1--3d_fullres__nnUNetTrainerV2__nnUNetPlansv2.1/ensembled_postprocessed

decoder:
  rankseg:
    metric: dice
    solver: RMA
    output_mode: multiclass
    pruning_prob: 0.5
    smooth: 0.0
    unassigned_policy: max_score

runtime:
  device: cuda

evaluation:
  foreground_labels: [1, 2]
  bootstrap_samples: 10000
  bootstrap_seed: 20260717
  postprocessing_file: ../work/v1/RESULTS_FOLDER/nnUNet/ensembles/Task005_Prostate/ensemble_2d__nnUNetTrainerV2__nnUNetPlansv2.1--3d_fullres__nnUNetTrainerV2__nnUNetPlansv2.1/postprocessing.json

outputs:
  dir: ../outputs/Task005_Prostate_ensemble_postprocessed_oof

provenance:
  evaluation_design: five-fold out-of-fold; every case predicted by the one fold that did not train on it
  split: nnU-Net v1 default KFold(n_splits=5, shuffle=true, random_state=12345)
  model_configuration: arithmetic mean of official 2d and 3d_fullres OOF probabilities
  configuration_role: primary; official best configuration and its prelearned postprocessing
  configuration_selected_before_rankseg_evaluation: true
  official_validation_average: 0.7592
  component_official_validation_averages: 2d=0.7341; 3d_fullres=0.7544
  postprocessing_selection: class 2 largest connected component; learned by official release before this benchmark
  model_url: https://zenodo.org/api/records/4003545/files/Task005_Prostate.zip/content
  model_md5: 364cd721162977d7e7e37d59f41c0dc4
  model_doi: https://doi.org/10.5281/zenodo.4003545
  dataset_url: https://msd-for-monai.s3-us-west-2.amazonaws.com/Task05_Prostate.tar
  dataset_md5: 35138f08b1efaef89d7424d2bcc928db
  dataset_license: CC-BY-SA-4.0
  label_correction_manifest: ../work/v1/release_labels/Task005_Prostate/corrections.json
  official_release_raw_summary_sha256: 5960ef0999a561b74dc7f58b2aed0820ce8fe1609caf23a40ce2a336c4876d46
  rankseg_source_commit: 00a1b87081d1d0cd1e8da8f8d1e6eb7a9c7dcf95
