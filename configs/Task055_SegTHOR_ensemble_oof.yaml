dataset:
  id: Task055_SegTHOR
  display_name: SegTHOR (official 3D fullres + cascade ensemble OOF + official postprocessing)
  labels:
    0: background
    1: esophagus
    2: heart
    3: trachea
    4: aorta
  channel_labels: [0, 1, 2, 3, 4]
  ignore_label: null

inputs:
  probabilities_dir: ../work/v1/oof/Task055_SegTHOR_ensemble/fold_predictions
  labels_dir: ../work/v1/nnUNet_raw_data_base/nnUNet_raw_data/Task055_SegTHOR/labelsTr
  probability_glob: "fold_*/not_postprocessed/*.npz"
  probability_key: softmax
  label_extension: .nii.gz
  native_predictions_dir: ../work/v1/oof/Task055_SegTHOR_native_postprocessed

decoder:
  rankseg:
    metric: dice
    solver: RMA
    output_mode: multiclass
    pruning_prob: 0.5
    smooth: 0.0
    unassigned_policy: max_score

runtime:
  device: cuda

evaluation:
  foreground_labels: [1, 2, 3, 4]
  bootstrap_samples: 10000
  bootstrap_seed: 20260802
  postprocessing_file: ../work/v1/RESULTS_FOLDER/nnUNet/ensembles/Task055_SegTHOR/ensemble_3d_fullres__nnUNetTrainerV2__nnUNetPlansv2.1--3d_cascade_fullres__nnUNetTrainerV2CascadeFullRes__nnUNetPlansv2.1/postprocessing.json

outputs:
  dir: ../outputs/Task055_SegTHOR_ensemble_oof

provenance:
  evaluation_design: five-fold out-of-fold; every patient predicted by the one fold that did not train on it
  split: nnU-Net v1 default KFold(n_splits=5, shuffle=true, random_state=12345)
  confirmation_cohort_status: fifth dataset in the prospective confirmation order locked on 2026-07-28
  model_configuration: arithmetic mean of official 3d_fullres and 3d_cascade_fullres OOF probabilities
  configuration_role: primary; highest official validation average (0.9150) in archive summary.csv
  configuration_selected_before_rankseg_evaluation: true
  component_official_validation_averages: 3d_fullres=0.9133; 3d_cascade_fullres=0.9141
  official_ensemble_validation_average: 0.9150
  model_url: https://zenodo.org/api/records/4003545/files/Task055_SegTHOR.zip/content
  model_mirror: https://zenodo.org/api/records/3734294/files/Task055_SegTHOR.zip/content
  model_md5: ae464374487596ab54f9d24bfd14b767
  model_doi: https://doi.org/10.5281/zenodo.4003545
  dataset_url: https://codalab.lisn.upsaclay.fr/my/datasets/download/3d24ba7b-42fd-469e-b5f5-dfcd3a0ac2f5
  dataset_size_bytes: 1820142473
  dataset_scope: official 40-patient labeled training archive
  rankseg_source_commit: 00a1b87081d1d0cd1e8da8f8d1e6eb7a9c7dcf95
