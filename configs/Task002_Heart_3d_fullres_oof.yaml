dataset:
  id: Task002_Heart
  display_name: MSD Heart (official nnU-Net v1, 3d_fullres OOF)
  labels:
    0: background
    1: left atrium
  channel_labels: [0, 1]
  ignore_label: null

inputs:
  probabilities_dir: ../work/v1/oof/Task002_Heart_3d_fullres/fold_predictions
  labels_dir: ../work/v1/nnUNet_raw_data_base/nnUNet_raw_data/Task002_Heart/labelsTr
  probability_glob: "fold_*/*.npz"
  probability_key: softmax
  label_extension: .nii.gz
  native_predictions_dir: ../work/v1/oof/Task002_Heart_3d_fullres/fold_predictions

decoder:
  rankseg:
    metric: dice
    solver: RMA
    output_mode: multiclass
    pruning_prob: 0.5
    smooth: 0.0
    unassigned_policy: max_score

runtime:
  device: cuda

evaluation:
  foreground_labels: [1]
  bootstrap_samples: 10000
  bootstrap_seed: 20260717
  postprocessing_file: ../work/v1/RESULTS_FOLDER/nnUNet/3d_fullres/Task002_Heart/nnUNetTrainerV2__nnUNetPlansv2.1/postprocessing.json

outputs:
  dir: ../outputs/Task002_Heart_3d_fullres_oof

provenance:
  evaluation_design: five-fold out-of-fold; every case predicted by the one fold that did not train on it
  split: nnU-Net v1 default KFold(n_splits=5, shuffle=true, random_state=12345)
  model_configuration: 3d_fullres, nnUNetTrainerV2, nnUNetPlansv2.1, model_final_checkpoint
  configuration_role: primary; highest official validation average (0.9329) in archive summary.csv
  configuration_selected_before_rankseg_evaluation: true
  postprocessing_selection: all-foreground largest connected component; learned by official release
  model_url: https://zenodo.org/api/records/4003545/files/Task002_Heart.zip/content
  model_md5: 47918532eabe17478eb29335b90b6604
  model_doi: https://doi.org/10.5281/zenodo.4003545
  dataset_url: https://msd-for-monai.s3-us-west-2.amazonaws.com/Task02_Heart.tar
  dataset_md5: 06ee59366e1e5124267b774dbd654057
  dataset_license: CC-BY-SA-4.0
  rankseg_source_commit: 00a1b87081d1d0cd1e8da8f8d1e6eb7a9c7dcf95
