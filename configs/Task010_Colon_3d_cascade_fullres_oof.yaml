dataset:
  id: Task010_Colon
  display_name: MSD Colon (official 3D cascade OOF; official no-op postprocessing)
  labels:
    0: background
    1: colon cancer primary
  channel_labels: [0, 1]
  ignore_label: null

inputs:
  probabilities_dir: ../work/v1/oof/Task010_Colon_3d_cascade_fullres/fold_predictions
  labels_dir: ../work/v1/nnUNet_raw_data_base/nnUNet_raw_data/Task010_Colon/labelsTr
  probability_glob: "fold_*/*.npz"
  probability_key: softmax
  label_extension: .nii.gz
  native_predictions_dir: ../work/v1/RESULTS_FOLDER/nnUNet/3d_cascade_fullres/Task010_Colon/nnUNetTrainerV2CascadeFullRes__nnUNetPlansv2.1/cv_niftis_raw

decoder:
  rankseg:
    metric: dice
    solver: RMA
    output_mode: multiclass
    pruning_prob: 0.5
    smooth: 0.0
    unassigned_policy: max_score

runtime:
  device: cuda

evaluation:
  foreground_labels: [1]
  bootstrap_samples: 10000
  bootstrap_seed: 20260727
  postprocessing_file: ../work/v1/RESULTS_FOLDER/nnUNet/3d_cascade_fullres/Task010_Colon/nnUNetTrainerV2CascadeFullRes__nnUNetPlansv2.1/postprocessing.json

outputs:
  dir: ../outputs/Task010_Colon_3d_cascade_fullres_oof

provenance:
  evaluation_design: five-fold out-of-fold; every case predicted by the one fold that did not train on it
  split: nnU-Net v1 default KFold(n_splits=5, shuffle=true, random_state=12345)
  model_configuration: official 3d_cascade_fullres OOF probabilities with fold-matched 3d_lowres inputs
  configuration_role: primary; highest official validation average (0.4937) in archive summary.csv
  configuration_selected_before_rankseg_evaluation: true
  component_official_validation_average_raw: 0.49366692516500854
  official_postprocessing: no-op; for_which_classes is empty
  model_url: https://zenodo.org/api/records/4003545/files/Task010_Colon.zip/content
  model_md5: ffa6a2ee13a41cdbde3addc151d3c773
  model_doi: https://doi.org/10.5281/zenodo.4003545
  dataset_url: https://msd-for-monai.s3-us-west-2.amazonaws.com/Task10_Colon.tar
  dataset_md5: bad7a188931dc2f6acf72b08eb6202d0
  dataset_license: CC-BY-SA-4.0
  rankseg_source_commit: 00a1b87081d1d0cd1e8da8f8d1e6eb7a9c7dcf95
